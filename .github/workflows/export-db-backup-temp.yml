name: Export Qudrat DB Backup Temp

on:
  push:
    paths:
      - '.github/workflows/export-db-backup-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://lqvfvpvyzoupdyqahwjy.supabase.co
  SUPABASE_KEY: sb_publishable_k7EwSBL9UTaVL_Zz_oB0Mg_oRXKcQvH

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export skills and questions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          curl -fsS "$SUPABASE_URL/rest/v1/skills?select=*&order=id.asc" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" > backup/skills.json
          for offset in 0 1000 2000; do
            curl -fsS "$SUPABASE_URL/rest/v1/questions?select=*&order=id.asc&limit=1000&offset=$offset" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" > "backup/questions-$offset.json"
          done
          python3 - <<'PY'
          import json, pathlib, zipfile
          p = pathlib.Path('backup')
          skills = json.loads((p/'skills.json').read_text(encoding='utf-8'))
          questions = []
          for off in (0,1000,2000):
              questions.extend(json.loads((p/f'questions-{off}.json').read_text(encoding='utf-8')))
          data = {'skills': skills, 'questions': questions}
          (p/'qudrat_questions_skills_backup.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          def lit(v, jsonb=False):
              if v is None: return 'NULL'
              if isinstance(v, bool): return 'TRUE' if v else 'FALSE'
              if isinstance(v, (int,float)) and not isinstance(v,bool): return str(v)
              if isinstance(v, (list,dict)):
                  s=json.dumps(v, ensure_ascii=False, separators=(',',':'))
                  return "'"+s.replace("'","''")+"'::jsonb"
              s=str(v)
              return "'"+s.replace("'","''")+"'"

          lines = [
              '-- Qudrat Simulator backup: skills + questions only',
              '-- Generated automatically from Supabase',
              'BEGIN;',
              '',
          ]
          if skills:
              cols=list(skills[0].keys())
              lines.append('INSERT INTO public.skills ('+', '.join(cols)+') VALUES')
              vals=[]
              for r in skills:
                  vals.append('  ('+', '.join(lit(r.get(c)) for c in cols)+')')
              lines.append(',\n'.join(vals)+';')
              lines.append('')
          if questions:
              cols=list(questions[0].keys())
              lines.append('INSERT INTO public.questions ('+', '.join(cols)+') VALUES')
              vals=[]
              for r in questions:
                  vals.append('  ('+', '.join(lit(r.get(c)) for c in cols)+')')
              lines.append(',\n'.join(vals)+';')
              lines.append('')
          lines += [
              "SELECT setval(pg_get_serial_sequence('public.skills','id'), COALESCE((SELECT MAX(id) FROM public.skills),1), true);",
              "SELECT setval(pg_get_serial_sequence('public.questions','id'), COALESCE((SELECT MAX(id) FROM public.questions),1), true);",
              'COMMIT;',
              ''
          ]
          (p/'qudrat_questions_skills_backup.sql').write_text('\n'.join(lines), encoding='utf-8')
          info = {'skills_count': len(skills), 'questions_count': len(questions)}
          (p/'backup_info.json').write_text(json.dumps(info, ensure_ascii=False, indent=2), encoding='utf-8')
          with zipfile.ZipFile(p/'qudrat_questions_skills_backup.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write(p/'qudrat_questions_skills_backup.json', arcname='qudrat_questions_skills_backup.json')
              z.write(p/'qudrat_questions_skills_backup.sql', arcname='qudrat_questions_skills_backup.sql')
              z.write(p/'backup_info.json', arcname='backup_info.json')
          print(info)
          PY
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: qudrat-questions-skills-backup
          path: backup/qudrat_questions_skills_backup.zip
          retention-days: 7
