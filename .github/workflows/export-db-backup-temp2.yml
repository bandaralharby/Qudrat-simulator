name: Export Qudrat DB Backup Temp 2

on:
  push:
    paths:
      - '.github/workflows/export-db-backup-temp2.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export questions and skills
        shell: bash
        run: |
          set -euo pipefail
          URL=$(sed -n "s/.*SUPABASE_URL='\([^']*\)'.*/\1/p" supabase-config.js)
          KEY=$(sed -n "s/.*SUPABASE_PUBLISHABLE_KEY='\([^']*\)'.*/\1/p" supabase-config.js)
          mkdir -p backup
          curl -fsS "$URL/rest/v1/skills?select=*&order=id.asc" -H "apikey: $KEY" > backup/skills.json
          for offset in 0 1000 2000; do
            curl -fsS "$URL/rest/v1/questions?select=*&order=id.asc&limit=1000&offset=$offset" -H "apikey: $KEY" > "backup/questions-$offset.json"
          done
          python3 - <<'PY'
          import json, pathlib, zipfile
          p=pathlib.Path('backup')
          skills=json.loads((p/'skills.json').read_text(encoding='utf-8'))
          questions=[]
          for off in (0,1000,2000):
              questions += json.loads((p/f'questions-{off}.json').read_text(encoding='utf-8'))
          (p/'qudrat_questions_skills_backup.json').write_text(json.dumps({'skills':skills,'questions':questions},ensure_ascii=False,indent=2),encoding='utf-8')
          def lit(v):
              if v is None: return 'NULL'
              if isinstance(v,bool): return 'TRUE' if v else 'FALSE'
              if isinstance(v,(int,float)) and not isinstance(v,bool): return str(v)
              if isinstance(v,(dict,list)):
                  s=json.dumps(v,ensure_ascii=False,separators=(',',':'))
                  return "'"+s.replace("'","''")+"'::jsonb"
              return "'"+str(v).replace("'","''")+"'"
          lines=['-- Qudrat Simulator backup: skills + questions only','BEGIN;','']
          for table,rows in [('skills',skills),('questions',questions)]:
              if not rows: continue
              cols=list(rows[0].keys())
              lines.append(f"INSERT INTO public.{table} ({', '.join(cols)}) VALUES")
              lines.append(',\n'.join('  ('+', '.join(lit(r.get(c)) for c in cols)+')' for r in rows)+';')
              lines.append('')
          lines += ["SELECT setval(pg_get_serial_sequence('public.skills','id'), COALESCE((SELECT MAX(id) FROM public.skills),1), true);","SELECT setval(pg_get_serial_sequence('public.questions','id'), COALESCE((SELECT MAX(id) FROM public.questions),1), true);",'COMMIT;','']
          (p/'qudrat_questions_skills_backup.sql').write_text('\n'.join(lines),encoding='utf-8')
          (p/'backup_info.json').write_text(json.dumps({'skills_count':len(skills),'questions_count':len(questions)},ensure_ascii=False,indent=2),encoding='utf-8')
          with zipfile.ZipFile(p/'qudrat_questions_skills_backup.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n in ('qudrat_questions_skills_backup.json','qudrat_questions_skills_backup.sql','backup_info.json'):
                  z.write(p/n,arcname=n)
          print('skills',len(skills),'questions',len(questions))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qudrat-questions-skills-backup
          path: backup/qudrat_questions_skills_backup.zip
          retention-days: 7
