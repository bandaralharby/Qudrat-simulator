<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب الطالب | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:#102a56;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:720px;margin:30px auto;padding:16px}.back{display:inline-block;margin-bottom:14px;text-decoration:none;color:#174f91;font-weight:800}.card{background:#fff;border:1px solid #dbe6f1;border-radius:20px;padding:22px;margin-bottom:15px;box-shadow:0 6px 22px rgba(30,70,120,.05)}.head{display:flex;align-items:center;gap:14px}.avatar{width:64px;height:64px;border-radius:50%;background:#dcecff;display:grid;place-items:center;font-size:32px}h1,h2{margin:0 0 8px}.muted{color:#66758f;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.item{background:#f7faff;border:1px solid #deebf7;border-radius:13px;padding:14px}.item small{display:block;color:#718096;margin-bottom:5px}.status{display:inline-block;padding:7px 12px;border-radius:999px;background:#eef2f7;font-weight:800}.status.active{background:#dcfce7;color:#166534}.logout{width:100%;border:0;border-radius:12px;padding:13px;background:#dc2626;color:#fff;font-size:16px;font-weight:900;cursor:pointer}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:17px}}</style></head><body><main class="wrap"><a class="back" href="dashboard.html">← العودة للرئيسية</a><section class="card"><div class="head"><span class="avatar">👤</span><div><h1 id="name">حساب الطالب</h1><p id="email" class="muted"></p></div></div></section><section class="card"><h2>بيانات الاشتراك</h2><div class="grid"><div class="item"><small>حالة الاشتراك</small><span id="status" class="status">—</span></div><div class="item"><small>الخطة الحالية</small><b id="plan">—</b></div><div class="item"><small>تاريخ البداية</small><b id="starts">—</b></div><div class="item"><small>تاريخ الانتهاء</small><b id="ends">—</b></div></div><p id="note" class="muted" style="margin-top:16px"></p></section><section class="card"><button id="logout" class="logout">تسجيل الخروج</button></section></main><script>(async()=>{const db=window.getQudratSupabase();const {data:{session}}=await db.auth.getSession();if(!session||session.user?.is_anonymous){location.replace('login.html');return}const u=session.user;let name=u.user_metadata?.full_name||u.user_metadata?.name||'';try{const {data:p}=await db.from('student_profiles').select('*').eq('user_id',u.id).maybeSingle();name=p?.full_name||p?.name||name}catch(e){}if(!name)name=(u.email||'الطالب').split('@')[0];document.getElementById('name').textContent=name;document.getElementById('email').textContent=u.email||'';const {data:s}=await db.from('subscriptions').select('*').eq('user_id',u.id).maybeSingle();const active=s?.status==='active'&&(!s.ends_at||new Date(s.ends_at)>new Date());const plans={free:'مجاني',monthly:'شهري',quarterly:'٣ أشهر',yearly:'سنوي',basic:'الأساسية',advanced:'المتقدمة',pro:'الاحترافية'};const fmt=d=>d?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium'}).format(new Date(d)):'—';document.getElementById('status').textContent=active?'فعّال':'غير فعّال';document.getElementById('status').className='status'+(active?' active':'');document.getElementById('plan').textContent=plans[s?.plan]||'مجاني';document.getElementById('starts').textContent=fmt(s?.starts_at||s?.created_at);document.getElementById('ends').textContent=fmt(s?.ends_at);document.getElementById('note').textContent=active?'اشتراكك فعّال ويمكنك استخدام مزايا باقتك.':'لا يوجد اشتراك فعّال حالياً.';document.getElementById('logout').onclick=async()=>{await db.auth.signOut({scope:'local'});try{localStorage.removeItem('sb-lqvfvpvyzoupdyqahwjy-auth-token')}catch(e){}location.replace('login.html')};})();</script></body></html>
