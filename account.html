<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#10254a}.wrap{max-width:760px;margin:40px auto;padding:18px}.card{background:#fff;border:1px solid #d8e0ea;border-radius:16px;padding:24px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.active{background:#dcfce7;color:#166534}.free,.expired,.cancelled{background:#f1f5f9;color:#475569}.btn{display:inline-block;padding:11px 16px;border:0;border-radius:9px;background:#173866;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.secondary{background:#e2e8f0;color:#173866}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:14px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px}.item small{display:block;color:#667085;margin-bottom:5px}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div id="need" class="notice" hidden>يلزم اشتراك فعّال للوصول إلى المحاكاة الكاملة والتدريب القصير.</div><section class="card"><div class="top"><div><h1 style="margin:0 0 6px">حساب الطالب</h1><div id="email" style="color:#667085"></div></div><button id="logout" class="btn secondary">تسجيل الخروج</button></div></section><section class="card"><h2>الاشتراك</h2><div class="grid"><div class="item"><small>الحالة</small><span id="status" class="badge free">مجاني</span></div><div class="item"><small>الخطة</small><b id="plan">مجانية</b></div><div class="item"><small>تاريخ البداية</small><b id="starts">—</b></div><div class="item"><small>تاريخ الانتهاء</small><b id="ends">—</b></div></div><p id="hint" style="color:#667085;line-height:1.8">يتم تفعيل الاشتراك حاليًا من إدارة الموقع.</p></section><section class="card"><h2>الوصول</h2><p id="accessText">جاري التحقق من الاشتراك...</p><a id="fullBtn" class="btn" href="exam-v29.html?v=27&type=mock&total=96&minutes=100&fresh=1" hidden>ابدأ المحاكاة الكاملة</a> <a id="trainingBtn" class="btn" href="training.html?v=2026090710" hidden>ابدأ التدريب القصير</a> <a class="btn secondary" href="exam-v29.html?v=27&type=mock&total=8&minutes=5&mode=devquick&fresh=1">التجربة السريعة</a> <a class="btn secondary" href="index.html">الرئيسية</a></section></main><script>
const {createClient}=supabase;const db=createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);const fmt=v=>v?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium'}).format(new Date(v)):'—';(async()=>{if(new URLSearchParams(location.search).get('needSubscription')==='1')$('need').hidden=false;const {data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html?next=account.html');return}$('email').textContent=session.user.email||'';const {data,error}=await db.from('subscriptions').select('status,plan,starts_at,ends_at').eq('user_id',session.user.id).maybeSingle();if(error){$('accessText').textContent='تعذر قراءة حالة الاشتراك.';return}const s=data||{status:'free',plan:'free'};const active=s.status==='active'&&(!s.ends_at||new Date(s.ends_at)>new Date());const labels={free:'مجاني',active:'فعّال',expired:'منتهي',cancelled:'ملغي'};const plans={free:'مجانية',monthly:'شهري',quarterly:'3 أشهر',yearly:'سنوي'};$('status').textContent=labels[s.status]||s.status;$('status').className='badge '+(active?'active':'free');$('plan').textContent=plans[s.plan]||s.plan;$('starts').textContent=fmt(s.starts_at);$('ends').textContent=fmt(s.ends_at);$('accessText').textContent=active?'اشتراكك فعّال ويمكنك استخدام المحاكاة والتدريب بالكامل.':'حسابك يعمل، لكن لا يوجد اشتراك فعّال حاليًا. يمكنك استخدام التجربة السريعة.';$('fullBtn').hidden=!active;$('trainingBtn').hidden=!active})();$('logout').onclick=async()=>{await db.auth.signOut();location.replace('index.html')};
</script></body></html>
