<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الطلاب | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#10254a}.wrap{max-width:520px;margin:60px auto;padding:18px}.card{background:#fff;border:1px solid #d8e0ea;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(16,37,74,.06)}h1{margin:0 0 8px}.muted{color:#667085;margin:0 0 22px}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:12px 14px;margin:0 0 16px;line-height:1.7}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.tabs button{padding:11px;border:1px solid #cad5e2;background:#f8fafc;border-radius:9px;font-weight:700;color:#173866}.tabs button.active{background:#173866;color:#fff}.form{display:grid;gap:12px}.form label{font-weight:700;font-size:14px}.form input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.primary{margin-top:4px;padding:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:16px;font-weight:800}.msg{min-height:24px;margin-top:12px;color:#b42318}.msg.ok{color:#15803d}.home{display:inline-block;margin-top:15px;color:#173866;text-decoration:none}.hidden{display:none}</style></head><body><main class="wrap"><section class="card"><h1>حساب الطالب</h1><p class="muted">سجّل الدخول أو أنشئ حسابًا للمتابعة.</p><div id="loginNotice" class="notice" hidden>يلزم أولًا تسجيل الدخول أو إنشاء حساب طالب.</div><div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="signupTab">إنشاء حساب</button></div><form id="loginForm" class="form"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" required autocomplete="email"><label>كلمة المرور</label><input id="loginPassword" type="password" required autocomplete="current-password"><button class="primary" type="submit">دخول</button></form><form id="signupForm" class="form hidden"><label>اسم الطالب</label><input id="fullName" required maxlength="80"><label>البريد الإلكتروني</label><input id="signupEmail" type="email" required autocomplete="email"><label>كلمة المرور</label><input id="signupPassword" type="password" required minlength="8" autocomplete="new-password"><button class="primary" type="submit">إنشاء الحساب</button></form><div id="msg" class="msg"></div><a class="home" href="index.html">العودة للرئيسية</a></section></main><script>
const db=window.getQudratSupabase();const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const STORAGE_KEY='sb-lqvfvpvyzoupdyqahwjy-auth-token';if(params.get('reason')==='login')$('loginNotice').hidden=false;function show(which){const login=which==='login';$('loginForm').classList.toggle('hidden',!login);$('signupForm').classList.toggle('hidden',login);$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login);$('msg').textContent=''}$('loginTab').onclick=()=>show('login');$('signupTab').onclick=()=>show('signup');
async function persistAndEnter(session){if(!session)return false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(session));const saved=localStorage.getItem(STORAGE_KEY);if(!saved)throw new Error('storage');await db.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token});location.replace('index.html');return true}catch(e){$('msg').textContent='تعذر حفظ تسجيل الدخول في هذا المتصفح. تأكد أن Safari ليس في التصفح الخاص وأن حظر جميع ملفات تعريف الارتباط غير مفعّل.';return false}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent='جارٍ تسجيل الدخول...';const {data,error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error){$('msg').textContent=/Invalid login credentials/i.test(error.message)?'البريد أو كلمة المرور غير صحيحة.':error.message;return}if(!data?.session){$('msg').textContent='تعذر إنشاء جلسة الدخول.';return}await persistAndEnter(data.session)};
$('signupForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent='جارٍ إنشاء الحساب...';const email=$('signupEmail').value.trim(),password=$('signupPassword').value,full_name=$('fullName').value.trim();const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name},emailRedirectTo:new URL('index.html',location.href).href}});if(error){$('msg').textContent=/already registered/i.test(error.message)?'الحساب موجود بالفعل؛ استخدم تسجيل الدخول.':error.message;return}if(data.session){await persistAndEnter(data.session);return}$('msg').classList.add('ok');$('msg').textContent='تم إنشاء الحساب. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.'};
(async()=>{try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);if(s?.access_token&&s?.refresh_token){const {data,error}=await db.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});if(!error&&data?.session){location.replace('index.html');return}}}const {data}=await db.auth.getSession();if(data?.session&&!data.session.user?.is_anonymous)location.replace('index.html')}catch(e){}})();
</script></body></html>
