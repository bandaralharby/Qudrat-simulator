]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ar=s=>String(s??'').replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);const html=s=>window.QudratMath?window.QudratMath.render(String(s??'')):esc(ar(s));const qs=Math.max(0,Math.min(100,Number(r.quantitative_score)||0)),vs=Math.max(0,Math.min(100,Number(r.verbal_score)||0)),total=Number(r.total)||review.length,good=Number(r.correct)||review.filter(x=>x.is_correct).length,bad=Math.max(0,total-good),overall=Math.max(0,Math.min(100,Number(r.score)||0)),pct=total?Math.round(good/total*100):0;score.textContent=ar(overall)+'%';correct.textContent=ar(good)+' إجابة صحيحة من '+ar(total);q.textContent=qVal.textContent=ar(qs)+'%';v.textContent=vVal.textContent=ar(vs)+'%';correctCount.textContent=goodLegend.textContent=ar(good);wrongCount.textContent=badLegend.textContent=ar(bad);qBar.style.height=qs+'%';vBar.style.height=vs+'%';donutGood.setAttribute('stroke-dasharray',pct+' '+(100-pct));donutText.innerHTML=ar(pct)+'%<br><small>صحيحة</small>';const skillData=Array.isArray(r.skills)?r.skills:[];const palette=['#2878d5','#16a6a1','#e5a51b','#2ba968','#5b9ee6','#9b62df','#ed6f91','#f29a43'];skills.innerHTML=skillData.length?skillData.map((s,i)=>{const n=Math.max(0,Math.min(100,Number(s.score)||0)),c=palette[i%palette.length];return '<div class="skillCol"><div class="skillPct">'+ar(n)+'%</div><div class="skillTower"><div class="skillFill" style="height:'+n+'%;background:'+c+'"></div></div><div class="skillName">'+esc(s.skill||'مهارة')+'</div></div>'}).join(''):'<p class="muted">لا تتوفر بيانات مهارات لهذه المحاولة.</p>';document.getElementById('review').innerHTML=review.map(x=>{const choices=(x.choices||[]).map(c=>'<div class="choice'+(c===x.correct_answer?' correctChoice':'')+(c===x.selected_answer&&!x.is_correct?' userWrong':'')+'">'+html(c)+(c===x.correct_answer?' ✓':'')+'</div>').join('');return '<article class="reviewItem"><div class="reviewQ">'+html(x.question_text)+'</div>'+choices+'<div class="explain"><b>ت
