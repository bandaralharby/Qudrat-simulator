<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحليل النتيجة | محاكي القدرات</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="math-render-v34.css?v=94"><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102a56;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}.result{max-width:920px;margin:24px auto;padding:0 15px 35px}.card{background:#fff;border:1px solid #d9e3ef;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px rgba(25,65,110,.05)}h1{text-align:center}.hero{text-align:center}.score{font:900 58px Arial;color:#1769c2}.muted{color:#6b7c94}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:24px;margin-top:5px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chartTitle{font-weight:900;font-size:18px;margin-bottom:18px}.bars{display:flex;align-items:flex-end;justify-content:center;gap:34px;height:190px;border-bottom:2px solid #dbe5ef;padding:0 15px}.barWrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;width:90px}.barValue{font-weight:900;margin-bottom:6px}.bar{width:58px;min-height:3px;border-radius:10px 10px 0 0;background:#1769c2}.bar.verbal{background:#7c4dca}.barLabel{font-weight:800;margin-top:7px}.donut{width:180px;height:180px;border-radius:50%;margin:8px auto;position:relative;display:grid;place-items:center}.donut:after{content:"";width:108px;height:108px;background:#fff;border-radius:50%;position:absolute}.donutText{z-index:1;text-align:center;font-weight:900;font-size:22px}.legend{display:flex;justify-content:center;gap:18px;font-size:13px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:5px}.green{background:#22a06b}.red{background:#d92d20}.skills .skill{margin:13px 0}.skillHead{display:flex;justify-content:space-between;font-weight:800;margin-bottom:5px}.track{height:13px;background:#e8eef5;border-radius:999px;overflow:hidden}.fill{height:100%;background:#1769c2;border-radius:999px}.reviewHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.reviewFilters{display:flex;gap:6px;flex-wrap:wrap}.reviewFilters button{border:1px solid #ccd8e5;background:#fff;border-radius:9px;padding:7px 10px}.reviewFilters .active{background:#173866;color:#fff}.reviewItem{background:#fff;border:1px solid #d9e3ef;border-radius:15px;padding:17px;margin:11px 0}.reviewItem.correct{border-right:5px solid #22a06b}.reviewItem.wrong{border-right:5px solid #d92d20}.reviewItem.unanswered{border-right:5px solid #f79009}.reviewMeta{display:flex;justify-content:space-between;color:#687995;font-size:12px}.reviewQ{font-size:18px;font-weight:800;line-height:1.9;margin:10px 0}.choice{border:1px solid #e1e7ef;border-radius:8px;padding:9px;margin:6px 0}.correctChoice{background:#ecfdf3}.userWrong{background:#fef3f2}.explain{margin-top:10px;background:#f3f6ff;border-radius:10px;padding:13px;line-height:1.9}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{border:0;display:inline-block;text-decoration:none;background:#1769c2;color:#fff;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#344054;border:1px solid #ccd6e2}.printTitle{display:none}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.reviewHead{display:block}.reviewFilters{margin-top:10px}}@media print{@page{size:A4;margin:10mm}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.result{max-width:none;margin:0;padding:0}.printTitle{display:block;text-align:center;margin:0 0 10px}.screenTitle,.reviewSection,.actions{display:none!important}body{background:#fff!important}.card{box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}.stats{grid-template-columns:repeat(4,1fr)}.charts{grid-template-columns:1fr 1fr}.analysisOnly{display:block!important}.score{font-size:44px}.bar{background:#1769c2!important}.bar.verbal{background:#7c4dca!important}.track{background:#e8eef5!important}.fill{background:#1769c2!important}.green{background:#22a06b!important}.red{background:#d92d20!important}.donut:after{background:#fff!important}}</style></head><body><main class="result"><h1 class="screenTitle">نتيجة الاختبار</h1><h1 class="printTitle">تقرير تحليل نتيجة محاكي القدرات</h1><div id="analysis" class="analysisOnly"><section class="card hero"><div class="score" id="score">--</div><div id="correct" class="muted"></div></section><section class="stats"><div class="card stat">كمي<b id="q">--</b></div><div class="card stat">لفظي<b id="v">--</b></div><div class="card stat">صحيحة<b id="correctCount">--</b></div><div class="card stat">خاطئة/متروكة<b id="wrongCount">--</b></div></section><section class="charts"><div class="card"><div class="chartTitle">مقارنة الأداء: الكمي واللفظي</div><div class="bars"><div class="barWrap"><span class="barValue" id="qVal"></span><div class="bar" id="qBar"></div><span class="barLabel">كمي</span></div><div class="barWrap"><span class="barValue" id="vVal"></span><div class="bar verbal" id="vBar"></div><span class="barLabel">لفظي</span></div></div></div><div class="card"><div class="chartTitle">الصحيح مقابل الخطأ</div><div id="donut" class="donut"><div class="donutText" id="donutText"></div></div><div class="legend"><span><i class="dot green"></i>صحيحة</span><span><i class="dot red"></i>خاطئة/متروكة</span></div></div></section><section class="card skills"><div class="chartTitle">الأداء حسب المهارات</div><div id="skills"></div></section></div><section class="reviewSection"><div class="card reviewHead"><div><h2 style="margin:0">مراجعة الحلول</h2><small class="muted">الأسئلة والإجابات والشروحات لا تدخل في الطباعة</small></div><div class="reviewFilters"><button class="active" data-filter="all">الكل</button><button data-filter="wrong">الخاطئة فقط</button><button data-filter="unanswered">غير المجابة</button></div></div><div id="review"></div></section><div class="actions"><button class="btn secondary" id="printResult">طباعة التحليل والرسوم</button><a class="btn" href="exam-v29.html?type=mock&total=96&minutes=100&fresh=1">محاكاة جديدة</a><a class="btn secondary" href="dashboard.html">لوحة الطالب</a></div></main><script src="math-render-safe-v40.js?v=113"></script><script>const raw=localStorage.getItem('qudrat_result');if(!raw){location.replace('dashboard.html')}const r=JSON.parse(raw||'{}'),review=Array.isArray(r.review)?r.review:[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ar=s=>String(s??'').replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);const html=s=>window.QudratMath?window.QudratMath.render(String(s??'')):esc(ar(s));const qs=Math.max(0,Math.min(100,Number(r.quantitative_score)||0)),vs=Math.max(0,Math.min(100,Number(r.verbal_score)||0)),total=Number(r.total)||review.length,good=Number(r.correct)||review.filter(x=>x.is_correct).length,bad=Math.max(0,total-good),overall=Math.max(0,Math.min(100,Number(r.score)||0));score.textContent=ar(overall)+'%';correct.textContent=ar(good)+' إجابة صحيحة من '+ar(total);q.textContent=qVal.textContent=ar(qs)+'%';v.textContent=vVal.textContent=ar(vs)+'%';correctCount.textContent=ar(good);wrongCount.textContent=ar(bad);qBar.style.height=qs+'%';vBar.style.height=vs+'%';const goodPct=total?Math.round(good/total*100):0;donut.style.background='conic-gradient(#22a06b 0 '+goodPct+'%,#d92d20 '+goodPct+'% 100%)';donutText.innerHTML=ar(goodPct)+'%<br><small>صحيحة</small>';const skillData=Array.isArray(r.skills)?r.skills:[];skills.innerHTML=skillData.length?skillData.map(s=>{const n=Math.max(0,Math.min(100,Number(s.score)||0));return '<div class="skill"><div class="skillHead"><span>'+esc(s.skill||'مهارة')+'</span><b>'+ar(n)+'%</b></div><div class="track"><div class="fill" style="width:'+n+'%"></div></div></div>'}).join(''):'<p class="muted">لا تتوفر بيانات مهارات لهذه المحاولة.</p>';function renderReview(f='all'){const rows=review.filter(x=>f==='all'||(f==='wrong'&&!x.is_correct)||(f==='unanswered'&&x.selected_answer==null));document.getElementById('review').innerHTML=rows.map(x=>{const st=x.is_correct?'correct':(x.selected_answer==null?'unanswered':'wrong'),lab=x.is_correct?'صحيحة':(x.selected_answer==null?'غير مجابة':'خاطئة');const choices=(x.choices||[]).map(c=>'<div class="choice'+(c===x.correct_answer?' correctChoice':'')+(c===x.selected_answer&&!x.is_correct?' userWrong':'')+'">'+html(c)+(c===x.correct_answer?' ✓':'')+'</div>').join('');return '<article class="reviewItem '+st+'"><div class="reviewMeta"><span>السؤال '+ar(review.indexOf(x)+1)+' · '+(x.section==='quantitative'?'كمي':'لفظي')+'</span><b>'+lab+'</b></div><div class="reviewQ">'+html(x.question_text)+'</div>'+choices+'<div class="explain"><b>توضيح الإجابة:</b><br>'+html(x.explanation||'لا يوجد شرح متاح.')+'</div></article>'}).join('')||'<div class="card muted">لا توجد أسئلة مطابقة.</div>'}renderReview();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderReview(b.dataset.filter)});printResult.onclick=()=>{document.documentElement.classList.add('printing');requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))};window.addEventListener('afterprint',()=>document.documentElement.classList.remove('printing'));</script></body></html>
