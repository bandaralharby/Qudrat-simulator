<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النتيجة والمراجعة | محاكي القدرات</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="math-render-v34.css?v=57"><style>
body{background:#eef1f5;padding:0;max-width:none;box-shadow:none}.result{max-width:900px;margin:25px auto;padding:0 16px 35px}.card{background:#fff;border:1px solid #d8dee8;border-radius:10px;padding:20px;margin-bottom:14px}.heroResult{text-align:center}.score{font-family:Arial;font-size:54px;color:#2563eb;font-weight:800}.muted{color:#667085}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:22px}.skillRow{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.reviewHead{display:flex;justify-content:space-between;gap:10px}.reviewFilters{display:flex;gap:7px;flex-wrap:wrap}.reviewFilters button{font-family:'Naskh';border:1px solid #d0d5dd;background:#fff;border-radius:7px;padding:7px 10px}.reviewFilters button.active{background:#172033;color:#fff}.reviewItem{background:#fff;border:1px solid #d8dee8;border-radius:10px;padding:18px;margin:12px 0}.reviewItem.correct{border-right:5px solid #22a06b}.reviewItem.wrong{border-right:5px solid #d92d20}.reviewItem.unanswered{border-right:5px solid #f79009}.reviewMeta{display:flex;justify-content:space-between;color:#667085;font-size:12px}.reviewQ{font-size:18px;font-weight:700;line-height:1.8}.choice{border:1px solid #e1e5eb;border-radius:7px;padding:9px 11px;margin:7px 0}.correctChoice{background:#ecfdf3;border-color:#86d5a8}.userWrong{background:#fef3f2;border-color:#f4aaa4}.badge{font-size:11px;font-weight:700;margin-right:7px}.explain{margin-top:12px;background:#f8fafc;border:1px solid #e4e7ec;border-radius:8px;padding:13px}.explain h4,.explain p{margin:0}.btn{display:inline-block;text-align:center;background:#2563eb;color:#fff;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:700}.btn.secondary{background:#fff;color:#344054;border:1px solid #d0d5dd}.actions{display:flex;gap:8px;justify-content:center}.summaryBar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summaryBox{text-align:center}.summaryBox b{display:block;font-size:20px}.reviewItem{scroll-margin-top:15px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.reviewHead{display:block}}
</style></head><body><main class="result"><h1>نتيجة الاختبار</h1><section class="card heroResult"><div class="score" id="score">--</div><div id="correct" class="muted"></div></section><section class="stats"><div class="card stat">كمي<b id="q">--</b></div><div class="card stat">لفظي<b id="v">--</b></div><div class="card stat">صحيحة<b id="correctCount">--</b></div><div class="card stat">خاطئة/متروكة<b id="wrongCount">--</b></div></section><section class="summaryBar"><div class="card summaryBox">تمت الإجابة<b id="answeredCount">--</b></div><div class="card summaryBox">غير مجابة<b id="unansweredCount">--</b></div><div class="card summaryBox">الدقة من المجاب<b id="accuracyCount">--</b></div></section><section class="card"><h3>الأداء حسب المهارات</h3><div id="skills"></div></section><section><div class="card reviewHead"><div><h2 style="margin:0">مراجعة الحلول</h2><small class="muted">إجابتك، الإجابة الصحيحة، وشرح الحل</small></div><div class="reviewFilters"><button class="active" data-filter="all">الكل</button><button data-filter="wrong">الخاطئة فقط</button><button data-filter="flagged">المراجعة</button><button data-filter="unanswered">غير المجابة</button></div></div><div id="review"></div></section><div class="actions"><button class="btn secondary" id="printResult" type="button">طباعة النتيجة</button><a class="btn" href="exam.html?type=mock&total=96&minutes=100&fresh=1">محاكاة جديدة</a><a class="btn secondary" href="index.html">الرئيسية</a></div></main><script src="math-render-safe-v40.js?v=57"></script><script>
const rawResult=localStorage.getItem('qudrat_result');if(!rawResult){document.body.innerHTML='<main class="wrap"><section class="card"><h2>لا توجد نتيجة محفوظة</h2><p>أكمل الاختبار أولًا ثم ستظهر النتيجة هنا.</p><a class="primary" href="index.html">الصفحة الرئيسية</a></section></main>';throw new Error('NO_RESULT')}['qudrat_active_session_v10','qudrat_active_session_v25','qudrat_active_session_v27','qudrat_active_session_v29'].forEach(k=>localStorage.removeItem(k));const r=JSON.parse(rawResult),review=Array.isArray(r.review)?r.review:[],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const arDigits=s=>String(s??'').replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function inferredDiagram(raw){const t=String(raw||''),nums=[...t.matchAll(/[0-9٠-٩]+/g)].map(m=>m[0]);if(/مثلث/.test(t))return `{{shape:triangle:${nums.slice(0,3).join(':')}}}`;if(/مستطيل/.test(t))return `{{shape:rect:${nums.slice(0,2).join(':')}}}`;if(/مربع/.test(t))return `{{shape:square:${nums[0]||''}}}`;if(/دائرة/.test(t))return `{{shape:circle:${nums[0]||''}}}`;return ''}function resultHTML(raw,infer=true){let s=String(raw??'');if(infer&&!/\{\{shape:|\{\{chart:/.test(s)){const d=inferredDiagram(s);if(d)s=d+' '+s}return window.QudratMath?window.QudratMath.render(s):esc(arDigits(s))}
score.textContent=(r.score??'--')+'%';correct.textContent=r.total?`${r.correct} إجابة صحيحة من ${r.total}`:'لا توجد نتيجة محفوظة';q.textContent=(r.quantitative_score??'--')+'%';v.textContent=(r.verbal_score??'--')+'%';correctCount.textContent=r.correct??'--';wrongCount.textContent=r.total!=null?r.total-r.correct:'--';const unanswered=review.filter(x=>x.selected_answer==null).length,answered=review.length-unanswered;answeredCount.textContent=answered;unansweredCount.textContent=unanswered;accuracyCount.textContent=answered?Math.round((Number(r.correct||0)/answered)*100)+'%':'--';skills.innerHTML=(r.skills||[]).map(s=>`<div class="skillRow"><span>${esc(s.skill)}</span><b>${esc(s.score)}%</b></div>`).join('');
function renderReview(f='all'){const rows=review.filter(x=>f==='all'||(f==='wrong'&&!x.is_correct)||(f==='flagged'&&x.flagged)||(f==='unanswered'&&x.selected_answer==null));document.getElementById('review').innerHTML=rows.map(x=>{const st=x.is_correct?'correct':(x.selected_answer==null?'unanswered':'wrong'),lab=x.is_correct?'صحيحة':(x.selected_answer==null?'غير مجابة':'خاطئة'),cs=(x.choices||[]).map(c=>`<div class="choice${c===x.correct_answer?' correctChoice':''}${c===x.selected_answer&&!x.is_correct?' userWrong':''}">${resultHTML(c,false)} ${c===x.correct_answer?'<span class="badge">✓ الإجابة الصحيحة</span>':(c===x.selected_answer?'<span class="badge">إجابتك</span>':'')}</div>`).join('');return `<article class="reviewItem ${st}"><div class="reviewMeta"><span>السؤال ${review.indexOf(x)+1} · ${x.section==='quantitative'?'كمي':'لفظي'} · ${esc(x.skill||'')}</span><b>${lab}${x.flagged?' · ★ للمراجعة':''}</b></div><div class="reviewQ">${resultHTML(x.question_text,true)}</div>${cs}<div class="explain"><h4>شرح الحل</h4><p>${resultHTML(x.explanation||'سيتم إضافة شرح تفصيلي لهذا السؤال قريبًا.',false)}</p></div></article>`}).join('')||'<div class="card muted">لا توجد أسئلة مطابقة.</div>'}renderReview();printResult.onclick=()=>window.print();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderReview(b.dataset.filter)});
</script></body></html>
