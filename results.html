5px solid #4f46e5;border-radius:14px;padding:18px}.explain h4{margin:0 0 12px;font-size:22px;color:#102a56}.explainBody{background:#fff;border-radius:14px;padding:16px;line-height:2}.exTitle{display:inline-block;background:#e7efff;color:#2563c9;font-weight:800;padding:4px 10px;border-radius:8px;margin:5px 0}.exStep{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.exNum{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:#3267e8;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800}.exAnswer{display:flex;gap:10px;align-items:center;margin-top:12px}.exAnswer .answerLabel{background:#e7efff;color:#2563c9;font-weight:800;padding:5px 10px;border-radius:8px}.exAnswer strong{flex:1;background:#eaf7ec;color:#287a3d;padding:7px 12px;border-radius:8px;text-align:center}.exVerbal{line-height:2}.btn{display:inline-block;text-align:center;background:#2563eb;color:#fff;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:700}.btn.secondary{background:#fff;color:#344054;border:1px solid #d0d5dd}.actions{display:flex;gap:8px;justify-content:center}.summaryBar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summaryBox{text-align:center}.summaryBox b{display:block;font-size:20px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.reviewHead{display:block}}.sqrt{display:inline-flex;direction:ltr;align-items:flex-start;position:relative;padding-left:.55em}.sqrt:before{content:'√';position:absolute;left:0;bottom:0;font-size:1.15em}.radicand{border-top:1.5px solid currentColor;padding:0 .08em}.pow{display:inline-block;direction:rtl;unicode-bidi:isolate}.pow sup{font-size:.65em;vertical-align:super;line-height:0;margin-right:.04em}</style></head><body><main class="result"><h1>نتيجة الاختبار</h1><section class="card heroResult"><div class="score" id="score">--</div><div id="correct" class="muted"></div></section><section class="stats"><div class="card stat">كمي<b id="q">--</b></div><div class="card stat">لفظي<b id="v">--</b></div><div class="card stat">صحيحة<b id="correctCount">--</b></div><div class="card stat">خاطئة/متروكة<b id="wrongCount">--</b></div></section><section class="summaryBar"><div class="card summaryBox">تمت الإجابة<b id="answeredCount">--</b></div><div class="card summaryBox">غير مجابة<b id="unansweredCount">--</b></div><div class="card summaryBox">الدقة من المجاب<b id="accuracyCount">--</b></div></section><section class="card"><h3>الأداء حسب المهارات</h3><div id="skills"></div></section><section><div class="card reviewHead"><div><h2 style="margin:0">مراجعة الحلول</h2><small class="muted">إجابتك، الإجابة الصحيحة، وشرح الحل</small></div><div class="reviewFilters"><button class="active" data-filter="all">الكل</button><button data-filter="wrong">الخاطئة فقط</button><button data-filter="flagged">المراجعة</button><button data-filter="unanswered">غير المجابة</button></div></div><div id="review"></div></section><div class="actions"><button class="btn secondary" id="printResult" type="button">طباعة النتيجة</button><a class="btn" href="exam.html?type=mock&total=96&minutes=100&fresh=1">محاكاة جديدة</a><a class="btn secondary" href="index.html">الرئيسية</a></div></main><script src="math-render-safe-v40.js?v=109"></script><script>
const rawResult=localStorage.getItem('qudrat_result');if(!rawResult){document.body.innerHTML='<main class="wrap"><section class="card"><h2>لا توجد نتيجة محفوظة</h2><p>أكمل الاختبار أولًا ثم ستظهر النتيجة هنا.</p><a class="primary" href="index.html">الصفحة الرئيسية</a></section></main>';throw new Error('NO_RESULT')}['qudrat_active_session_v10','qudrat_active_session_v25','qudrat_active_session_v27','qudrat_active_session_v29'].forEach(k=>localStorage.removeItem(k));const r=JSON.parse(rawResult),review=Array.isArray(r.review)?r.review:[],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalizeTokens(raw){return String(raw??'').replace(/\{\{\s*([^{}]+?)\s*\}\}/g,(all,inside)=>{let p=inside.split(':').map(x=>x.trim());if(['shape','chart','frac','sqrt','pow'].includes((p[0]||'').toLowerCase()))return all;const idx=p.findIndex(x=>['shape','chart','frac','sqrt','pow'].includes(x.toLowerCase()));if(idx<0)return all;const kind=p[idx].toLowerCase(),before=p.slice(0,idx),after=p.slice(idx+1);if(kind==='shape'){const type=(after.shift()||before.shift()||'rect').toLowerCase();return `{{shape:${type}${before.length?':'+before.join(':'):''}}}`}if(kind==='pow'&&before.length>=2)return `{{pow:${before[0]}:${before[1]}}`;if(kind==='sqrt'&&before.length)return `{{sqrt:${before[0]}}`;if(kind==='frac'&&before.length>=2)return `{{frac:${before[0]}:${before[1]}}`;return all})}
const arDigits=s=>String(s??'').replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function inferredDiagram(raw){const t=String(raw||''),nums=[...t.matchAll(/[0-9٠-٩]+/g)].map(m=>m[0]);if(/مثلث/.test(t))return `{{shape:triangle:${nums.slice(0,3).join(':')}}}`;if(/مستطيل/.test(t))return `{{shape:rect:${nums.slice(0,2).join(':')}}}`;if(/مربع/.test(t))return `{{shape:square:${nums[0]||''}}}`;if(/دائرة/.test(t))return `{{shape:circle:${nums[0]||''}}}`;return ''}function resultHTML(raw,infer=true){let s=normalizeTokens(raw);if(infer&&!/\{\{shape:|\{\{chart:/.test(s)){const d=inferredDiagram(s);if(d)s=d+' '+s}let out=window.QudratMath?window.QudratMath.render(s):esc(arDigits(s));out=out.replace(/√\s*([٠-٩]+(?:[.,٫][٠-٩]+)?)/g,'<span class="sqrt"><span class="radicand">$1</span></span>');out=out.replace(/([اأإآء-ي٠-٩]+)\s*[\^²]\s*([٢2]?)/g,(m,b,e)=>'<span class="pow">'+b+'<sup>'+(e||'٢')+'</sup></span>');return out}function explanationHTML(raw,section,answer){let s=String(raw??'').replace(/\\n/g,'\n').replace(/\r\n?/g,'\n').replace(/\u2028|\u2029/g,'\n').trim();let cleanAnswer=String(answer??'').replace(/[.،؛:!؟]+\s*$/,'').trim();if(section!=='quantitative'){s=s.replace(/\n?\s*الإجابة(?:\s+النهائية)?\s*[:：][^\n]*\s*$/m,'').trim();return '<div class="explainBody"><div class="exVerbal">'+resultHTML(s||'لا يوجد شرح متاح.',false)+'</div>'+(cleanAnswer?'<div class="exAnswer"><span class="answerLabel">الإجابة:</span><strong>'+resultHTML(cleanAnswer,false)+'</strong></div>':'')+'</div>'}let law='',steps=[];const lm=s.match(/(?:القانون|القاعدة)\s*[:：]\s*([\s\S]*?)(?=\s*(?:الحل(?:\s+خطوة\s+بخطوة)?|التطبيق)\s*[:：]|$)/);if(lm)law=lm[1].trim();const sm=s.match(/(?:الحل(?:\s+خطوة\s+بخطوة)?|التطبيق)\s*[:：]\s*([\s\S]*?)(?=\s*الإجابة(?:\s+النهائية)?\s*[:：]|$)/);if(sm){const body=sm[1].trim();const numbered=[...body.matchAll(/(?:^|\s)[١٢٣٤٥٦٧٨٩٠0-9]+[)\.\-–]\s*([\s\S]*?)(?=(?:\s[١٢٣٤٥٦٧٨٩٠0-9]+[)\.\-–]\s*)|$)/g)].map(m=>m[1].trim()).filter(Boolean);steps=numbered.length?numbered:body.split(/\n+/).map(x=>x.trim()).filter(Boolean)}const am=s.match(/الإجابة(?:\s+النهائية)?\s*[:：]\s*([^\n]+)/);if(am)cleanAnswer=am[1].trim().replace(/[.،؛:!؟]+\s*$/,'');let out='<div class="explainBody">';if(law)out+='<div class="exTitle">القانون:</div><div>'+resultHTML(law,false)+'</div>';if(steps.length){steps=steps.map((st,i)=>{let y=st.trim();if(/=\s*$/.test(y)){if(i===steps.length-1&&cleanAnswer)y+=' '+cleanAnswer;else{const nums=[...y.matchAll(/[0-9٠-٩۰-۹]+/g)].map(m=>m[0]);if(nums.length){/* keep non-final incomplete equations from displaying a dangling equals */y=y.replace(/\s*=\s*$/,'')}}}return y});out+='<div class="exTitle">الحل خطوة بخطوة:</div>';steps.forEach((st,i)=>out+='<div class="exStep"><span class="exNum">'+arDigits(i+1)+'</span><span>'+resultHTML(st,false)+'</span></div>')}if(cleanAnswer)out+='<div class="exAnswer"><span class="answerLabel">الإجابة:</span><strong>'+resultHTML(cleanAnswer,false)+'</strong></div>';return out+'</div>'}
score.textContent=(r.score??'--')+'%';correct.textContent=r.total?`${r.correct} إجابة صحيحة من ${r.total}`:'لا توجد نتيجة محفوظة';q.textContent=(r.quantitative_score??'--')+'%';v.textContent=(r.verbal_score??'--')+'%';correctCount.textContent=r.correct??'--';wrongCount.textContent=r.total!=null?r.total-r.correct:'--';const unanswered=review.filter(x=>x.selected_answer==null).length,answered=review.length-unanswered;answeredCount.textContent=answered;unansweredCount.textContent=unanswered;accuracyCount.textContent=answered?Math.round((Number(r.correct||0)/answered)*100)+'%':'--';skills.innerHTML=(r.skills||[]).map(s=>`<div class="skillRow"><span>${esc(s.skill)}</span><b>${esc(s.score)}%</b></div>`).join('');function renderReview(f='all'){const rows=review.filter(x=>f==='all'||(f==='wrong'&&!x.is_correct)||(f==='flagged'&&x.flagged)||(f==='unanswered'&&x.selected_answer==null));document.getElementById('review').innerHTML=rows.map(x=>{const st=x.is_correct?'correct':(x.selected_answer==null?'unanswered':'wrong'),lab=x.is_correct?'صحيحة':(x.selected_answer==null?'غير مجابة':'خاطئة'),cs=(x.choices||[]).map(c=>`<div class="choice${c===x.correct_answer?' correctChoice':''}${c===x.selected_answer&&!x.is_correct?' userWrong':''}">${resultHTML(c,false)} ${c===x.correct_answer?'<span class="badge">✓ الإجابة الصحيحة</span>':(c===x.selected_answer?'<span class="badge">إجابتك</span>':'')}</div>`).join('');return `<article class="reviewItem ${st}"><div class="reviewMeta"><span>السؤال ${review.indexOf(x)+1} · ${x.section==='quantitative'?'كمي':'لفظي'} · ${esc(x.skill||'')}</span><b>${lab}${x.flagged?' · ★ للمراجعة':''}</b></div><div class="reviewQ">${resultHTML(x.question_text,true)}</div>${cs}<div class="explain"><h4>توضيح الإجابة:</h4>${explanationHTML(x.explanation||'سيتم إضافة شرح تفصيلي لهذا السؤال قريبًا.',x.section,x.correct_answer)}</div></article>`}).join('')||'<div class="card muted">لا توجد أسئلة مطابقة.</div>'}renderReview();printResult.onclick=()=>window.print();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderReview(b.dataset.filter)});
</script></body></html>
