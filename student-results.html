<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النتائج السابقة | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:#102a56;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:850px;margin:25px auto;padding:14px}.head,.card{background:#fff;border:1px solid #dbe6f1;border-radius:18px;padding:18px;margin-bottom:14px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{background:#eef3f9;color:#173866;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800}.result{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:8px;align-items:center;border-top:1px solid #edf1f5;padding:15px 0}.result:first-child{border-top:0}.score{text-align:center}.score b{display:block;font-size:22px}.score small,.date{color:#718096}.empty{text-align:center;padding:35px;color:#718096}@media(max-width:620px){.result{grid-template-columns:1fr 1fr}.date{grid-column:1/-1}.head h1{font-size:22px}}</style></head><body><main class="wrap"><section class="head"><div><h1 style="margin:0">النتائج السابقة</h1><div style="color:#718096;margin-top:5px">نتائج محاولاتك المكتملة</div></div><a class="back" href="index.html">الرئيسية</a></section><section class="card"><div id="loading">جاري تحميل النتائج...</div><div id="list"></div></section></main><script>(async()=>{const db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);const {data:{session}}=await db.auth.getSession();if(!session||session.user?.is_anonymous){location.replace('login.html?next=student-results.html');return}const {data,error}=await db.from('exam_attempts').select('exam_type,completed_at,score,quantitative_score,verbal_score').eq('user_id',session.user.id).not('completed_at','is',null).order('completed_at',{ascending:false}).limit(50);document.getElementById('loading').remove();const list=document.getElementById('list');if(error){list.innerHTML='<div class="empty">تعذر تحميل النتائج.</div>';return}if(!data?.length){list.innerHTML='<div class="empty">لا توجد نتائج سابقة حتى الآن.</div>';return}const n=v=>v==null?'—':new Intl.NumberFormat('ar-SA',{maximumFractionDigits:1}).format(v);list.innerHTML=data.map(r=>`<div class="result"><div><b>${r.exam_type==='training'?'تدريب قصير':'محاكاة'}</b><div class="date">${new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(r.completed_at))}</div></div><div class="score"><small>الدرجة</small><b>${n(r.score)}</b></div><div class="score"><small>الكمي</small><b>${n(r.quantitative_score)}</b></div><div class="score"><small>اللفظي</small><b>${n(r.verbal_score)}</b></div></div>`).join('')})();</script></body></html>
