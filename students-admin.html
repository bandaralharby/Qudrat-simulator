<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>اشتراكات الطلاب | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#10254a}.wrap{max-width:1180px;margin:30px auto;padding:16px}.head,.card{background:#fff;border:1px solid #d8e0ea;border-radius:14px;padding:18px;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0 0 5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;background:#173866;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.btn.light{background:#e2e8f0;color:#173866}.btn.danger{background:#b42318}.phoneBtn{padding:5px 8px;font-size:12px;margin-right:6px}.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:right;padding:11px;border-bottom:1px solid #e5e7eb}th{background:#f8fafc}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.active{background:#dcfce7;color:#166534}.free,.expired,.cancelled{background:#f1f5f9;color:#475569}.rowBtns{display:flex;gap:5px;flex-wrap:wrap}.msg{padding:12px;border-radius:8px;background:#fff7ed;color:#9a3412}.empty{text-align:center;color:#667085;padding:30px}@media(max-width:700px){.wrap{margin:0;padding:10px}.head,.card{border-radius:12px;padding:14px}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:22px}.actions{width:100%}.actions .btn{flex:1;text-align:center}.toolbar{display:grid;grid-template-columns:1fr auto}.toolbar input{min-width:0;width:100%}.tableWrap{overflow:visible}table{min-width:0;display:block}thead{display:none}tbody{display:grid;gap:12px}tr{display:block;background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:13px;box-shadow:0 2px 8px rgba(15,35,70,.04)}td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #edf1f5;text-align:left;overflow-wrap:anywhere}td:first-child{font-size:17px;color:#10254a}td:last-child{border-bottom:0;padding-top:12px;display:block}td:nth-child(1)::before{content:'الطالب';font-size:12px;color:#64748b}td:nth-child(2)::before{content:'الجوال';font-size:12px;color:#64748b}td:nth-child(3)::before{content:'البريد';font-size:12px;color:#64748b}td:nth-child(4)::before{content:'الحالة';font-size:12px;color:#64748b}td:nth-child(5)::before{content:'الباقة';font-size:12px;color:#64748b}td:nth-child(6)::before{content:'الانتهاء';font-size:12px;color:#64748b}td:nth-child(7)::before{content:'إدارة الاشتراك';display:block;text-align:right;margin-bottom:8px;font-size:12px;color:#64748b}.rowBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.rowBtns .btn{width:100%;min-width:0;padding:10px 5px}.empty{padding:22px 8px}}</style></head><body><main class="wrap"><section class="head"><div><h1>اشتراكات الطلاب</h1><div id="owner" style="color:#667085"></div></div><div class="actions"><a class="btn light" href="admin.html">لوحة المالك</a><button id="logout" class="btn light">خروج</button></div></section><section class="card"><div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو رقم الجوال أو البريد"><button id="refresh" class="btn">تحديث</button></div><div id="message"></div><div class="tableWrap"><table><thead><tr><th>الطالب</th><th>الجوال</th><th>البريد</th><th>الحالة</th><th>الباقة</th><th>الانتهاء</th><th>إدارة الاشتراك</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>لا يوجد طلاب مسجلون بعد.</div></section></main><script src="students-admin.js?v=6"></script></body></html>
