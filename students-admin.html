<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشتراكات الطلاب | محاكي القدرات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#10254a}.wrap{max-width:1100px;margin:30px auto;padding:16px}.head,.card{background:#fff;border:1px solid #d8e0ea;border-radius:14px;padding:18px;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:9px 12px;background:#173866;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.btn.light{background:#e2e8f0;color:#173866}.btn.danger{background:#b42318}.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:right;padding:11px;border-bottom:1px solid #e5e7eb}th{background:#f8fafc}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.active{background:#dcfce7;color:#166534}.free,.expired,.cancelled{background:#f1f5f9;color:#475569}.rowBtns{display:flex;gap:5px;flex-wrap:wrap}.msg{padding:12px;border-radius:8px;background:#fff7ed;color:#9a3412}.empty{text-align:center;color:#667085;padding:30px}</style></head><body><main class="wrap"><section class="head"><div><h1 style="margin:0 0 5px">اشتراكات الطلاب</h1><div id="owner" style="color:#667085"></div></div><div class="actions"><a class="btn light" href="admin.html">لوحة المالك</a><button id="logout" class="btn light">خروج</button></div></section><section class="card"><div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو البريد"><button id="refresh" class="btn">تحديث</button></div><div id="message"></div><div class="tableWrap"><table><thead><tr><th>الطالب</th><th>البريد</th><th>الحالة</th><th>الخطة</th><th>الانتهاء</th><th>إدارة الاشتراك</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>لا يوجد طلاب مسجلون بعد.</div></section></main><script src="students-admin.js"></script></body></html>
